<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f5;
    }

    .sidebar {
      width: 220px;
      height: 100vh;
      background: linear-gradient(180deg, indigo, purple);
      display: flex;
      flex-direction: column;
      padding-top: 20px;
    }

    .sidebar button {
      background-color: #444;
      color: #fff;
      border: none;
      padding: 15px;
      margin: 10px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
    }

    .sidebar button:hover {
      background-color: grey;
      transform: scale(1.05);
      transition: all 0.3s ease;
    }

    .content {
      margin-left: 220px;
      padding: 20px;
    }

    .header {
      background-color: #6a5acd;
      color: white;
      padding: 15px;
      font-size: 20px;
      border-bottom: 2px solid grey;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <button id="btn1">My Website</button>
    <button id="btn2">Edit Website</button>
    <button id="btn3">Pre-view Website</button>
    <button id="btn4">Save/Export</button>
  </div>

  <div class="content">
    <div class="header">Dashboard</div>
    <p>Welcome to your animated interface.</p>
  </div>

  <!-- GSAP Animation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    gsap.from(".sidebar button", {
      x: -50,
      opacity: 0,
      duration: 0.8,
      stagger: 0.2,
      ease: "power2.out"
    });
  </script>
</body>
</html>
