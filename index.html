<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Website Builder</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f5;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar styles */
    .sidebar {
      width: 240px;
      background: linear-gradient(180deg, indigo, purple);
      display: flex;
      flex-direction: column;
      padding-top: 20px;
      color: white;
      box-shadow: 2px 0 8px rgba(0,0,0,0.2);
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .sidebar button {
      background-color: #444;
      color: #fff;
      border: none;
      padding: 15px;
      margin: 10px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .sidebar button:hover {
      background-color: grey;
      transform: scale(1.05);
    }

    /* Main content area */
    .main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      background-color: #6a5acd;
      color: white;
      padding: 15px;
      font-size: 20px;
      border-bottom: 2px solid grey;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header span {
      font-weight: bold;
    }

    /* Builder workspace */
    .builder {
      flex-grow: 1;
      display: flex;
      overflow: hidden;
    }

    /* Editor panel */
    .editor-panel {
      width: 40%;
      background-color: #fff;
      border-right: 2px solid #ddd;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .editor-panel h3 {
      margin-bottom: 10px;
      color: indigo;
    }

    .editor-panel textarea {
      width: 100%;
      height: 200px;
      border: 2px solid indigo;
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      resize: vertical;
    }

    /* Drag-and-drop blocks */
    .blocks {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .block {
      background-color: #6a5acd;
      color: white;
      padding: 10px;
      border-radius: 6px;
      cursor: grab;
      user-select: none;
      transition: transform 0.2s;
    }

    .block:active {
      transform: scale(1.1);
    }

    /* Preview panel */
    .preview-panel {
      flex-grow: 1;
      background-color: #fafafa;
      padding: 20px;
      overflow-y: auto;
      border-left: 2px solid #ddd;
    }

    .preview-panel h3 {
      margin-bottom: 10px;
      color: purple;
    }

    .preview {
      min-height: 400px;
      border: 2px dashed grey;
      border-radius: 8px;
      padding: 20px;
      background-color: #fff;
    }

    /* Motion graphics: animated gradient background */
    @keyframes gradientShift {
      0% { background: linear-gradient(180deg, indigo, purple); }
      50% { background: linear-gradient(180deg, purple, grey); }
      100% { background: linear-gradient(180deg, indigo, purple); }
    }

    .sidebar {
      animation: gradientShift 10s infinite alternate;
    }
  </style>
</head>
<body>
  <!-- Sidebar navigation -->
  <div class="sidebar">
    <h2>Builder Menu</h2>
    <button>My Website</button>
    <button>Edit Website</button>
    <button>Pre-view Website</button>
    <button>Save/Export</button>
    <button>Create Website</button>
  </div>

  <!-- Main workspace -->
  <div class="main">
    <div class="header">
      <span>Website Builder Dashboard</span>
      <span>⚙️ Settings</span>
    </div>

    <div class="builder">
      <!-- Editor panel -->
      <div class="editor-panel">
        <h3>✏️ Code Editor</h3>
        <textarea id="editor" placeholder="Type HTML content here..."></textarea>

        <h3>📦 Drag & Drop Blocks</h3>
        <div class="blocks">
          <div class="block" draggable="true" data-html="<h1>Welcome to My Site</h1>">Heading</div>
          <div class="block" draggable="true" data-html="<p>This is a paragraph block.</p>">Paragraph</div>
          <div class="block" draggable="true" data-html="<button>Click Me</button>">Button</div>
          <div class="block" draggable="true" data-html="<img src='https://via.placeholder.com/150' alt='Placeholder'>">Image</div>
        </div>
      </div>

      <!-- Preview panel -->
      <div class="preview-panel">
        <h3>👁️ Live Preview</h3>
        <div class="preview" id="preview">Your live preview will appear here.</div>
      </div>
    </div>
  </div>

  <!-- JavaScript for interactivity -->
  <script>
    const editor = document.getElementById("editor");
    const preview = document.getElementById("preview");

    // Update preview when typing HTML
    editor.addEventListener("input", () => {
      preview.innerHTML = editor.value;
    });

    // Drag-and-drop functionality
    const blocks = document.querySelectorAll(".block");

    blocks.forEach(block => {
      block.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/html", block.dataset.html);
      });
    });

    preview.addEventListener("dragover", e => {
      e.preventDefault();
    });

    preview.addEventListener("drop", e => {
      e.preventDefault();
      const html = e.dataTransfer.getData("text/html");
      preview.innerHTML += html;
      editor.value += "\n" + html;
    });
  </script>
</body>
</html>
