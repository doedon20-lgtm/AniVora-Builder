<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AniVora Builder</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

.builder-header {
  padding: 16px;
  background: #111827;
  border-bottom: 1px solid #334155;
}

.builder-header h1 {
  margin: 0;
  font-size: 22px;
}

.builder-header p {
  margin: 5px 0 0;
  color: #94a3b8;
  font-size: 13px;
}

.builder {
  max-width: 1100px;
  margin: auto;
  padding: 15px;
}

textarea,
input {
  width: 100%;
  padding: 14px;
  border-radius: 9px;
  border: 1px solid #475569;
  background: #1e293b;
  color: white;
  font-size: 15px;
  outline: none;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 6px;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: bold;
}

.generate {
  width: 100%;
  margin-top: 12px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #7c3aed;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.generate:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.examples {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.example {
  border: none;
  padding: 9px 12px;
  border-radius: 8px;
  background: #334155;
  color: white;
}

.status {
  margin-top: 12px;
  color: #94a3b8;
  font-size: 13px;
}

/* EDITOR */

.editor {
  margin-top: 20px;
  padding: 15px;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 12px;
}

.editor h2 {
  margin-top: 0;
  font-size: 18px;
}

.color-row {
  display: flex;
  gap: 10px;
  align-items: center;
}

.color-row input {
  height: 45px;
  padding: 3px;
  width: 70px;
}

/* SECTION MANAGER */

.section-manager {
  margin-top: 20px;
  padding: 15px;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 12px;
}

.section-manager h2 {
  margin-top: 0;
  font-size: 18px;
}

.section-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.section-buttons button {
  padding: 10px 12px;
  border: none;
  border-radius: 8px;
  background: #334155;
  color: white;
}

.current-sections {
  margin-top: 15px;
}

.section-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px;
  margin-top: 8px;
  background: #1e293b;
  border-radius: 8px;
}

.section-item button {
  border: none;
  border-radius: 6px;
  padding: 7px 10px;
  background: #dc2626;
  color: white;
}

/* PREVIEW CONTROLS */

.preview-controls {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.preview-controls button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  background: #334155;
  color: white;
}

.preview-controls button.active {
  background: #7c3aed;
}

/* PREVIEW */

.preview-wrapper {
  margin-top: 12px;
  background: #020617;
  border-radius: 12px;
  padding: 15px;
  overflow: auto;
}

.preview-box {
  background: white;
  margin: auto;
  transition: width 0.3s ease;
  min-height: 600px;
  color: #111827;
}

.preview-box.desktop {
  width: 100%;
}

.preview-box.mobile {
  width: 390px;
  max-width: 100%;
}

.preview-bar {
  padding: 10px 14px;
  background: #e2e8f0;
  color: #334155;
  font-size: 13px;
  font-weight: bold;
}

/* WEBSITE */

#website {
  background: white;
  color: #111827;
}

.site-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 6%;
  border-bottom: 1px solid #e5e7eb;
}

.logo {
  font-size: 20px;
  font-weight: bold;
}

.nav-links {
  display: flex;
  gap: 18px;
  font-size: 14px;
}

.hero {
  text-align: center;
  padding: 80px 20px;
  background: linear-gradient(135deg, #f5f3ff, #ffffff);
}

.hero h1 {
  font-size: 42px;
  margin: 0 auto 18px;
  max-width: 700px;
}

.hero p {
  max-width: 600px;
  margin: auto;
  color: #64748b;
  font-size: 17px;
  line-height: 1.6;
}

.hero-button {
  display: inline-block;
  margin-top: 25px;
  padding: 13px 22px;
  background: var(--main-color, #7c3aed);
  color: white;
  border-radius: 8px;
  font-weight: bold;
}

.section {
  padding: 60px 6%;
}

.section-title {
  text-align: center;
  font-size: 28px;
  margin-bottom: 35px;
}

.features,
.services,
.testimonials {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.feature,
.service,
.testimonial {
  padding: 25px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  background: white;
}

.feature p,
.service p,
.testimonial p {
  color: #64748b;
  line-height: 1.5;
}

.about {
  background: #f8fafc;
}

.about-content {
  max-width: 700px;
  margin: auto;
  text-align: center;
  color: #64748b;
  line-height: 1.7;
}

.pricing {
  text-align: center;
  background: #f8fafc;
}

.price {
  font-size: 40px;
  font-weight: bold;
}

.contact {
  text-align: center;
}

.contact-box {
  max-width: 500px;
  margin: auto;
}

.site-footer {
  padding: 30px;
  text-align: center;
  background: #111827;
  color: white;
}

@media (max-width: 650px) {

  .nav-links {
    display: none;
  }

  .hero {
    padding: 60px 20px;
  }

  .hero h1 {
    font-size: 32px;
  }

  .features,
  .services,
  .testimonials {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<header class="builder-header">

  <h1>🚀 AniVora Builder</h1>

  <p>
    Describe → Generate → Edit → Build → Preview
  </p>

</header>


<div class="builder">

<textarea
id="prompt"
placeholder="Example: Create a modern website for an AI startup..."
></textarea>


<button
id="generateButton"
class="generate"
onclick="generateWebsite()"
>
✨ Generate Website
</button>


<div class="examples">

<button class="example"
onclick="useExample('restaurant')">
🍔 Restaurant
</button>

<button class="example"
onclick="useExample('portfolio')">
💼 Portfolio
</button>

<button class="example"
onclick="useExample('fashion')">
👕 Fashion
</button>

<button class="example"
onclick="useExample('fitness')">
🏋️ Fitness
</button>

<button class="example"
onclick="useExample('saas')">
💻 SaaS
</button>

</div>


<div
class="status"
id="status">
Ready.
</div>


<!-- EDITOR -->

<div class="editor">

<h2>✏️ Edit Website</h2>


<label>
Website Name
</label>

<input
id="editName"
placeholder="AniVora"
oninput="updateWebsite()"
>


<label>
Headline
</label>

<input
id="editHeadline"
placeholder="Your headline"
oninput="updateWebsite()"
>


<label>
Description
</label>

<textarea
id="editDescription"
placeholder="Your website description"
oninput="updateWebsite()"
></textarea>


<label>
Button Text
</label>

<input
id="editButton"
placeholder="Get Started"
oninput="updateWebsite()"
>


<label>
Main Color
</label>

<div class="color-row">

<input
id="editColor"
type="color"
value="#7c3aed"
oninput="updateWebsite()"
>

<span>
Choose your brand color
</span>

</div>

</div>


<!-- SECTION MANAGER -->

<div class="section-manager">

<h2>
🧩 Sections
</h2>

<div class="section-buttons">

<button onclick="addSection('about')">
➕ About
</button>

<button onclick="addSection('features')">
➕ Features
</button>

<button onclick="addSection('services')">
➕ Services
</button>

<button onclick="addSection('testimonials')">
➕ Testimonials
</button>

<button onclick="addSection('pricing')">
➕ Pricing
</button>

<button onclick="addSection('contact')">
➕ Contact
</button>

</div>


<div
id="currentSections"
class="current-sections">
</div>

</div>


<!-- PREVIEW CONTROLS -->

<div class="preview-controls">

<button
id="desktopButton"
class="active"
onclick="setDesktop()">
🖥️ Desktop
</button>

<button
id="mobileButton"
onclick="setMobile()">
📱 Mobile
</button>

<button
onclick="resetWebsite()">
🔄 Reset
</button>

</div>


<!-- PREVIEW -->

<div class="preview-wrapper">

<div
id="previewBox"
class="preview-box desktop">

<div class="preview-bar">
LIVE PREVIEW
</div>

<div id="website">

<section class="hero">

<h1>
Your Website
</h1>

<p>
Generate a website to begin.
</p>

<div class="hero-button">
Get Started
</div>

</section>

</div>

</div>

</div>

</div>


<script>

let sections = [
  "hero",
  "features",
  "pricing"
];


/* =========================
   EXAMPLES
========================= */

function useExample(type) {

  const prompt =
    document.getElementById("prompt");

  if (type === "restaurant") {

    prompt.value =
      "Create a modern restaurant website with a menu, reservations, customer reviews, location and a beautiful food-focused design.";

  }

  if (type === "portfolio") {

    prompt.value =
      "Create a professional developer portfolio with a hero section, projects, skills, GitHub links, experience and contact section.";

  }

  if (type === "fashion") {

    prompt.value =
      "Create a luxury fashion website with collections, products, an editorial design, shopping section and newsletter.";

  }

  if (type === "fitness") {

    prompt.value =
      "Create a modern fitness website with workout programs, trainers, pricing, testimonials and contact information.";

  }

  if (type === "saas") {

    prompt.value =
      "Create a modern SaaS website for an AI startup with features, pricing, testimonials, FAQ and a strong call to action.";

  }

}


/* =========================
   REAL BACKEND CONNECTION
========================= */

async function generateWebsite() {

  const prompt =
    document.getElementById("prompt").value.trim();

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("generateButton");


  if (!prompt) {

    status.innerText =
      "⚠️ Describe your website first.";

    return;

  }


  button.disabled = true;

  button.innerText =
    "⏳ Connecting to AniVora AI...";

  status.innerText =
    "Sending your website request to AniVora...";


  try {

    const response =
      await fetch("/api/generate", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          prompt: prompt
        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "The AniVora backend returned an error."
      );

    }


    console.log(
      "AniVora backend response:",
      data
    );


    status.innerText =
      "✅ AniVora backend connected successfully.";


    /*
      TEMPORARY TEST

      The backend currently sends the prompt
      back to us. Later, this response will
      contain the AI-generated website.
    */

    alert(
      "AniVora backend connected successfully!\n\n" +
      "Prompt received:\n\n" +
      data.prompt
    );


  } catch (error) {

    console.error(
      "AniVora generation error:",
      error
    );


    status.innerText =
      "❌ Could not connect to AniVora AI backend.";


    alert(
      "AniVora could not connect to the backend.\n\n" +
      error.message
    );


  } finally {

    button.disabled = false;

    button.innerText =
      "✨ Generate Website";

  }

}


/* =========================
   ADD SECTION
========================= */

function addSection(type) {

  if (sections.includes(type)) {

    document.getElementById("status").innerText =
      "⚠️ That section is already on the page.";

    return;

  }


  sections.push(type);

  updateWebsite();

  document.getElementById("status").innerText =
    "✅ Section added.";

}


/* =========================
   REMOVE SECTION
========================= */

function removeSection(type) {

  sections =
    sections.filter(
      section => section !== type
    );


  updateWebsite();

  document.getElementById("status").innerText =
    "🗑️ Section removed.";

}


/* =========================
   SECTION LIST
========================= */

function updateSectionList() {

  const container =
    document.getElementById("currentSections");

  container.innerHTML = "";


  sections.forEach(section => {

    const item =
      document.createElement("div");

    item.className =
      "section-item";


    const label =
      document.createElement("span");

    label.innerText =
      section.toUpperCase();


    const remove =
      document.createElement("button");

    remove.innerText =
      "Remove";


    remove.onclick =
      function() {

        removeSection(section);

      };


    item.appendChild(label);

    item.appendChild(remove);

    container.appendChild(item);

  });

}


/* =========================
   UPDATE WEBSITE
========================= */

function updateWebsite() {

  const name =
    document.getElementById("editName").value ||
    "AniVora";

  const title =
    document.getElementById("editHeadline").value ||
    "Your Website";

  const description =
    document.getElementById("editDescription").value ||
    "Your website description.";

  const button =
    document.getElementById("editButton").value ||
    "Get Started";

  const color =
    document.getElementById("editColor").value;


  let html = `

    <nav class="site-nav">

      <div class="logo">
        ${name}
      </div>

      <div class="nav-links">

        <span>Home</span>
        <span>Features</span>
        <span>About</span>
        <span>Contact</span>

      </div>

    </nav>

  `;


  /* HERO */

  if (sections.includes("hero")) {

    html += `

      <section class="hero">

        <h1>
          ${title}
        </h1>

        <p>
          ${description}
        </p>

        <div
          class="hero-button"
          style="background:${color}"
        >
          ${button}
        </div>

      </section>

    `;

  }


  /* FEATURES */

  if (sections.includes("features")) {

    html += `

      <section class="section">

        <h2 class="section-title">
          Features
        </h2>

        <div class="features">

          <div class="feature">

            <h3>
              Powerful
            </h3>

            <p>
              Everything you need to get started.
            </p>

          </div>

          <div class="feature">

            <h3>
              Simple
            </h3>

            <p>
              Easy to understand and easy to use.
            </p>

          </div>

          <div class="feature">

            <h3>
              Modern
            </h3>

            <p>
              Designed for today's users.
            </p>

          </div>

        </div>

      </section>

    `;

  }


  /* ABOUT */

  if (sections.includes("about")) {

    html += `

      <section class="section about">

        <h2 class="section-title">
          About Us
        </h2>

        <div class="about-content">

          <p>
            We create useful digital experiences
            designed to help people and businesses grow.
          </p>

        </div>

      </section>

    `;

  }


  /* SERVICES */

  if (sections.includes("services")) {

    html += `

      <section class="section">

        <h2 class="section-title">
          Our Services
        </h2>

        <div class="services">

          <div class="service">

            <h3>
              Strategy
            </h3>

            <p>
              Professional solutions designed around your goals.
            </p>

          </div>

          <div class="service">

            <h3>
              Design
            </h3>

            <p>
              Beautiful experiences built for modern users.
            </p>

          </div>

          <div class="service">

            <h3>
              Development
            </h3>

            <p>
              Reliable technology built to grow with you.
            </p>

          </div>

        </div>

      </section>

    `;

  }


  /* TESTIMONIALS */

  if (sections.includes("testimonials")) {

    html += `

      <section class="section">

        <h2 class="section-title">
          What People Say
        </h2>

        <div class="testimonials">

          <div class="testimonial">

            <p>
              "An amazing experience from start to finish."
            </p>

            <strong>
              — Customer
            </strong>

          </div>

          <div class="testimonial">

            <p>
              "Simple, beautiful and easy to use."
            </p>

            <strong>
              — Customer
            </strong>

          </div>

          <div class="testimonial">

            <p>
              "Exactly what we needed."
            </p>

            <strong>
              — Customer
            </strong>

          </div>

        </div>

      </section>

    `;

  }


  /* PRICING */

  if (sections.includes("pricing")) {

    html += `

      <section class="section pricing">

        <h2 class="section-title">
          Simple Pricing
        </h2>

        <div class="price">
          $19
        </div>

        <p>
          Start today.
        </p>

        <div
          class="hero-button"
          style="background:${color}"
        >
          ${button}
        </div>

      </section>

    `;

  }


  /* CONTACT */

  if (sections.includes("contact")) {

    html += `

      <section class="section contact">

        <h2 class="section-title">
          Contact Us
        </h2>

        <div class="contact-box">

          <p>
            Ready to get started?
          </p>

          <div
            class="hero-button"
            style="background:${color}"
          >
            Contact Us
          </div>

        </div>

      </section>

    `;

  }


  /* FOOTER */

  html += `

    <footer class="site-footer">

      Built with AniVora Builder 🚀

    </footer>

  `;


  const website =
    document.getElementById("website");


  website.innerHTML =
    html;


  website.style.setProperty(
    "--main-color",
    color
  );


  updateSectionList();

}


/* =========================
   DESKTOP
========================= */

function setDesktop() {

  const preview =
    document.getElementById("previewBox");


  preview.classList.remove("mobile");

  preview.classList.add("desktop");


  document
    .getElementById("desktopButton")
    .classList.add("active");


  document
    .getElementById("mobileButton")
    .classList.remove("active");

}


/* =========================
   MOBILE
========================= */

function setMobile() {

  const preview =
    document.getElementById("previewBox");


  preview.classList.remove("desktop");

  preview.classList.add("mobile");


  document
    .getElementById("mobileButton")
    .classList.add("active");


  document
    .getElementById("desktopButton")
    .classList.remove("active");

}


/* =========================
   RESET
========================= */

function resetWebsite() {

  sections = [
    "hero",
    "features",
    "pricing"
  ];


  document.getElementById("editName").value =
    "";

  document.getElementById("editHeadline").value =
    "";

  document.getElementById("editDescription").value =
    "";

  document.getElementById("editButton").value =
    "";

  document.getElementById("editColor").value =
    "#7c3aed";


  updateWebsite();


  document.getElementById("status").innerText =
    "Preview reset.";

}


/* =========================
   INITIALIZE
========================= */

updateSectionList();

updateWebsite();

</script>

</body>
  </html>
