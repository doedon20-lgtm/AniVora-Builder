<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniVora Builder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            padding: 18px;
            border-bottom: 1px solid #252535;
            background: #10101a;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #8b5cf6;
        }

        .app {
            display: flex;
            min-height: calc(100vh - 65px);
        }

        .sidebar {
            width: 330px;
            padding: 20px;
            background: #10101a;
            border-right: 1px solid #252535;
            overflow-y: auto;
        }

        .sidebar h2 {
            margin-bottom: 10px;
        }

        .sidebar p {
            color: #9999aa;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            resize: vertical;
            background: #181824;
            color: white;
            border: 1px solid #303044;
            border-radius: 10px;
            padding: 13px;
            outline: none;
            font-size: 14px;
        }

        textarea:focus,
        input:focus {
            border-color: #8b5cf6;
        }

        button {
            cursor: pointer;
            border: none;
        }

        .generate-btn {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border-radius: 10px;
            background: #8b5cf6;
            color: white;
            font-size: 15px;
            font-weight: bold;
        }

        .generate-btn:hover {
            background: #7c3aed;
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .examples {
            margin-top: 22px;
        }

        .examples h3,
        .editor h3,
        .sections h3 {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .example-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .example-buttons button {
            padding: 10px;
            border-radius: 8px;
            background: #1b1b29;
            color: #ddd;
            border: 1px solid #2c2c3c;
        }

        .example-buttons button:hover {
            background: #252538;
        }

        .editor {
            margin-top: 25px;
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            font-size: 12px;
            color: #aaaabb;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #303044;
            background: #181824;
            color: white;
            outline: none;
        }

        .color-row {
            display: flex;
            gap: 10px;
        }

        input[type="color"] {
            width: 55px;
            padding: 3px;
            height: 40px;
        }

        .sections {
            margin-top: 25px;
        }

        .section-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }

        .section-buttons button {
            padding: 9px;
            border-radius: 8px;
            background: #1b1b29;
            color: white;
            border: 1px solid #303044;
        }

        .section-buttons button:hover {
            background: #252538;
        }

        .section-list {
            margin-top: 12px;
        }

        .section-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px;
            margin-bottom: 6px;
            background: #181824;
            border-radius: 8px;
            font-size: 13px;
        }

        .remove-section {
            background: #3a1d25;
            color: #ff8c9a;
            padding: 5px 8px;
            border-radius: 6px;
        }

        .workspace {
            flex: 1;
            padding: 20px;
            min-width: 0;
        }

        .workspace-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .workspace-top h2 {
            font-size: 18px;
        }

        .preview-controls {
            display: flex;
            gap: 7px;
        }

        .preview-controls button {
            padding: 8px 12px;
            border-radius: 7px;
            background: #1b1b29;
            color: white;
            border: 1px solid #303044;
        }

        .preview-controls button.active {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }

        .preview-area {
            background: #161620;
            border: 1px solid #29293a;
            border-radius: 12px;
            min-height: 700px;
            padding: 20px;
            display: flex;
            justify-content: center;
            overflow: auto;
        }

        .preview-frame {
            width: 100%;
            max-width: 1100px;
            min-height: 650px;
            background: white;
            color: #111;
            border-radius: 8px;
            overflow: hidden;
            transition: width 0.3s ease;
        }

        .preview-frame.mobile {
            width: 390px;
        }

        /* Generated website */

        .site-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 35px;
            border-bottom: 1px solid #eee;
        }

        .site-logo {
            font-size: 20px;
            font-weight: bold;
        }

        .site-nav-links {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .site-hero {
            padding: 90px 35px;
            text-align: center;
        }

        .site-hero h1 {
            font-size: 52px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .site-hero p {
            max-width: 650px;
            margin: 0 auto 25px;
            color: #666;
            line-height: 1.7;
        }

        .site-button {
            display: inline-block;
            padding: 13px 22px;
            color: white;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        .site-section {
            padding: 70px 35px;
        }

        .site-section h2 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 32px;
        }

        .site-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .site-card {
            padding: 25px;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #fafafa;
        }

        .site-card h3 {
            margin-bottom: 10px;
        }

        .site-card p {
            color: #666;
            line-height: 1.6;
        }

        .site-footer {
            padding: 30px;
            text-align: center;
            background: #111;
            color: #aaa;
        }

        @media (max-width: 850px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #252535;
            }

            .site-hero h1 {
                font-size: 38px;
            }

            .site-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">AniVora Builder</div>
</header>

<div class="app">

    <aside class="sidebar">

        <h2>Build a Website</h2>

        <p>
            Describe the website or app you want AniVora to build.
        </p>

        <textarea
            id="prompt"
            placeholder="Example: Build a luxury restaurant website with a black and gold design, menu, reservations, reviews and location..."
        ></textarea>

        <button class="generate-btn" onclick="generateWebsite()">
            Generate Website
        </button>

        <div class="examples">
            <h3>Examples</h3>

            <div class="example-buttons">
                <button onclick="useExample('restaurant')">Restaurant</button>
                <button onclick="useExample('portfolio')">Portfolio</button>
                <button onclick="useExample('fashion')">Fashion</button>
                <button onclick="useExample('fitness')">Fitness</button>
                <button onclick="useExample('saas')">SaaS</button>
            </div>
        </div>

        <div class="editor">

            <h3>Website Editor</h3>

            <div class="field">
                <label>Website Name</label>
                <input id="siteName" value="AniVora">
            </div>

            <div class="field">
                <label>Headline</label>
                <input id="headline" value="Build Something Amazing">
            </div>

            <div class="field">
                <label>Description</label>
                <input id="description" value="Create beautiful websites with AniVora.">
            </div>

            <div class="field">
                <label>Button Text</label>
                <input id="buttonText" value="Get Started">
            </div>

            <div class="field">
                <label>Main Color</label>

                <div class="color-row">
                    <input type="color" id="mainColor" value="#8b5cf6">
                </div>
            </div>

        </div>

        <div class="sections">

            <h3>Sections</h3>

            <div class="section-buttons">
                <button onclick="addSection('about')">+ About</button>
                <button onclick="addSection('features')">+ Features</button>
                <button onclick="addSection('services')">+ Services</button>
                <button onclick="addSection('testimonials')">+ Reviews</button>
                <button onclick="addSection('pricing')">+ Pricing</button>
                <button onclick="addSection('contact')">+ Contact</button>
            </div>

            <div class="section-list" id="sectionList"></div>

        </div>

    </aside>

    <main class="workspace">

        <div class="workspace-top">

            <h2>Live Preview</h2>

            <div class="preview-controls">

                <button
                    id="desktopBtn"
                    class="active"
                    onclick="setDesktop()"
                >
                    Desktop
                </button>

                <button
                    id="mobileBtn"
                    onclick="setMobile()"
                >
                    Mobile
                </button>

                <button onclick="resetWebsite()">
                    Reset
                </button>

            </div>

        </div>

        <div class="preview-area">

            <div
                class="preview-frame"
                id="previewFrame"
            ></div>

        </div>

    </main>

</div>

<script>

let sections = [
    "hero",
    "features",
    "pricing"
];


/* =========================
   EXAMPLES
========================= */

function useExample(type) {

    const prompt = document.getElementById("prompt");

    if (type === "restaurant") {
        prompt.value =
            "Build a luxury restaurant website with a black and gold design, menu, reservations, customer reviews and location.";
    }

    if (type === "portfolio") {
        prompt.value =
            "Build a modern developer portfolio with a dark futuristic design, projects, skills, GitHub links and contact section.";
    }

    if (type === "fashion") {
        prompt.value =
            "Build a luxury fashion brand website with a premium editorial design, products, collections and newsletter.";
    }

    if (type === "fitness") {
        prompt.value =
            "Build a fitness website with workout programs, trainers, pricing, testimonials and a contact section.";
    }

    if (type === "saas") {
        prompt.value =
            "Build a modern SaaS landing page with features, pricing, testimonials, FAQ and a strong call to action.";
    }

}


/* =========================
   AI BACKEND CONNECTION
========================= */

async function generateWebsite() {

    const prompt =
        document.getElementById("prompt").value.trim();

    if (!prompt) {

        alert(
            "Describe the website you want to build."
        );

        return;
    }

    const button =
        document.querySelector(".generate-btn");

    if (button) {

        button.disabled = true;

        button.textContent =
            "Connecting to AniVora AI...";

    }

    try {

        const response = await fetch(
            "/api/generate",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    prompt: prompt
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Generation failed."
            );

        }

        console.log(
            "AniVora AI response:",
            data
        );

        alert(
            "Backend connected successfully!\n\n" +
            "Your prompt:\n" +
            data.prompt
        );

    } catch (error) {

        console.error(error);

        alert(
            "AniVora could not connect to the AI backend.\n\n" +
            error.message
        );

    } finally {

        if (button) {

            button.disabled = false;

            button.textContent =
                "Generate Website";

        }

    }

}


/* =========================
   ADD SECTION
========================= */

function addSection(type) {

    if (sections.includes(type)) {

        alert(
            "This section is already on the website."
        );

        return;
    }

    sections.push(type);

    updateSectionList();

    updateWebsite();

}


/* =========================
   REMOVE SECTION
========================= */

function removeSection(type) {

    sections =
        sections.filter(
            section => section !== type
        );

    updateSectionList();

    updateWebsite();

}


/* =========================
   SECTION LIST
========================= */

function updateSectionList() {

    const list =
        document.getElementById("sectionList");

    list.innerHTML = "";

    sections.forEach(section => {

        const item =
            document.createElement("div");

        item.className =
            "section-item";

        const name =
            section.charAt(0).toUpperCase() +
            section.slice(1);

        item.innerHTML = `
            <span>${name}</span>

            ${
                section !== "hero"
                ? `<button
                    class="remove-section"
                    onclick="removeSection('${section}')"
                   >
                    Remove
                   </button>`
                : ""
            }
        `;

        list.appendChild(item);

    });

}


/* =========================
   WEBSITE RENDERER
========================= */

function updateWebsite() {

    const name =
        document.getElementById("siteName").value;

    const headline =
        document.getElementById("headline").value;

    const description =
        document.getElementById("description").value;

    const buttonText =
        document.getElementById("buttonText").value;

    const color =
        document.getElementById("mainColor").value;

    const preview =
        document.getElementById("previewFrame");

    let html = `

        <nav class="site-nav">

            <div class="site-logo">
                ${name}
            </div>

            <div class="site-nav-links">
                <span>Home</span>
                <span>About</span>
                <span>Services</span>
                <span>Contact</span>
            </div>

        </nav>

    `;


    sections.forEach(section => {

        if (section === "hero") {

            html += `

                <section class="site-hero">

                    <h1>
                        ${headline}
                    </h1>

                    <p>
                        ${description}
                    </p>

                    <a
                        href="#"
                        class="site-button"
                        style="background:${color}"
                    >
                        ${buttonText}
                    </a>

                </section>

            `;

        }


        if (section === "about") {

            html += `

                <section class="site-section">

                    <h2>About Us</h2>

                    <div
                        style="
                            max-width:700px;
                            margin:auto;
                            text-align:center;
                            line-height:1.8;
                            color:#666;
                        "
                    >
                        We create meaningful experiences
                        through thoughtful design,
                        technology and innovation.
                    </div>

                </section>

            `;

        }


        if (section === "features") {

            html += `

                <section class="site-section">

                    <h2>Features</h2>

                    <div class="site-grid">

                        <div class="site-card">
                            <h3>Powerful</h3>
                            <p>
                                Everything you need
                                to build something great.
                            </p>
                        </div>

                        <div class="site-card">
                            <h3>Beautiful</h3>
                            <p>
                                Modern designs created
                                for today's users.
                            </p>
                        </div>

                        <div class="site-card">
                            <h3>Simple</h3>
                            <p>
                                Easy to use and designed
                                to save you time.
                            </p>
                        </div>

                    </div>

                </section>

            `;

        }


        if (section === "services") {

            html += `

                <section class="site-section">

                    <h2>Our Services</h2>

                    <div class="site-grid">

                        <div class="site-card">
                            <h3>Web Design</h3>
                            <p>
                                Beautiful websites
                                built for your brand.
                            </p>
                        </div>

                        <div class="site-card">
                            <h3>Development</h3>
                            <p>
                                Fast and responsive
                                digital experiences.
                            </p>
                        </div>

                        <div class="site-card">
                            <h3>Consulting</h3>
                            <p>
                                Strategy and technology
                                guidance for your business.
                            </p>
                        </div>

                    </div>

                </section>

            `;

        }


        if (section === "testimonials") {

            html += `

                <section class="site-section">

                    <h2>What People Say</h2>

                    <div class="site-grid">

                        <div class="site-card">
                            <p>
                                "Amazing experience."
                            </p>
                            <br>
                            <strong>Alex</strong>
                        </div>

                        <div class="site-card">
                            <p>
                                "Beautiful and simple."
                            </p>
                            <br>
                            <strong>Jordan</strong>
                        </div>

                        <div class="site-card">
                            <p>
                                "Exactly what we needed."
                            </p>
                            <br>
                            <strong>Taylor</strong>
                        </div>

                    </div>

                </section>

            `;

        }


        if (section === "pricing") {

            html += `

                <section class="site-section">

                    <h2>Pricing</h2>

                    <div class="site-grid">

                        <div class="site-card">
                            <h3>Starter</h3>
                            <h2>$9</h2>
                            <p>
                                Perfect for getting started.
                            </p>
                        </div>

                        <div class="site-card">
                            <h3>Pro</h3>
                            <h2>$29</h2>
                            <p>
                                For growing businesses.
                            </p>
                        </div>

                        <div class="site-card">
                            <h3>Business</h3>
                            <h2>$79</h2>
                            <p>
                                For serious teams.
                            </p>
                        </div>

                    </div>

                </section>

            `;

        }


        if (section === "contact") {

            html += `

                <section class="site-section">

                    <h2>Contact Us</h2>

                    <div
                        style="
                            max-width:500px;
                            margin:auto;
                        "
                    >

                        <input
                            placeholder="Your Name"
                            style="
                                width:100%;
                                padding:14px;
                                margin-bottom:10px;
                                border:1px solid #ddd;
                                border-radius:7px;
                            "
                        >

                        <input
                            placeholder="Your Email"
                            style="
                                width:100%;
                                padding:14px;
                                margin-bottom:10px;
                                border:1px solid #ddd;
                                border-radius:7px;
                            "
                        >

                        <textarea
                            placeholder="Your Message"
                            style="
                                width:100%;
                                height:120px;
                                padding:14px;
                                border:1px solid #ddd;
                                border-radius:7px;
                            "
                        ></textarea>

                        <br><br>

                        <a
                            href="#"
                            class="site-button"
                            style="background:${color}"
                        >
                            Send Message
                        </a>

                    </div>

                </section>

            `;

        }

    });


    html += `

        <footer class="site-footer">
            © ${new Date().getFullYear()}
            ${name}.
            All rights reserved.
        </footer>

    `;


    preview.innerHTML = html;

}


/* =========================
   DESKTOP
========================= */

function setDesktop() {

    const frame =
        document.getElementById("previewFrame");

    frame.classList.remove("mobile");

    document
        .getElementById("desktopBtn")
        .classList.add("active");

    document
        .getElementById("mobileBtn")
        .classList.remove("active");

}


/* =========================
   MOBILE
========================= */

function setMobile() {

    const frame =
        document.getElementById("previewFrame");

    frame.classList.add("mobile");

    document
        .getElementById("mobileBtn")
        .classList.add("active");

    document
        .getElementById("desktopBtn")
        .classList.remove("active");

}


/* =========================
   RESET
========================= */

function resetWebsite() {

    document.getElementById("siteName").value =
        "AniVora";

    document.getElementById("headline").value =
        "Build Something Amazing";

    document.getElementById("description").value =
        "Create beautiful websites with AniVora.";

    document.getElementById("buttonText").value =
        "Get Started";

    document.getElementById("mainColor").value =
        "#8b5cf6";

    sections = [
        "hero",
        "features",
        "pricing"
    ];

    updateSectionList();

    updateWebsite();

}


/* =========================
   LIVE EDITING
========================= */

document
    .getElementById("siteName")
    .addEventListener(
        "input",
        updateWebsite
    );

document
    .getElementById("headline")
    .addEventListener(
        "input",
        updateWebsite
    );

document
    .getElementById("description")
    .addEventListener(
        "input",
        updateWebsite
    );

document
    .getElementById("buttonText")
    .addEventListener(
        "input",
        updateWebsite
    );

document
    .getElementById("mainColor")
    .addEventListener(
        "input",
        updateWebsite
    );


/* =========================
   INITIALIZE
========================= */

updateSectionList();

updateWebsite();

</script>

</body>
  </html>
