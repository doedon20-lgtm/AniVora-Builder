<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AniVora Builder</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

.builder-header {
  padding: 16px;
  background: #111827;
  border-bottom: 1px solid #334155;
}

.builder-header h1 {
  margin: 0;
  font-size: 22px;
}

.builder-header p {
  margin: 5px 0 0;
  color: #94a3b8;
  font-size: 13px;
}

.builder {
  max-width: 1100px;
  margin: auto;
  padding: 15px;
}

textarea,
input {
  width: 100%;
  padding: 14px;
  border-radius: 9px;
  border: 1px solid #475569;
  background: #1e293b;
  color: white;
  font-size: 15px;
  outline: none;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 6px;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: bold;
}

.generate {
  width: 100%;
  margin-top: 12px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #7c3aed;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.examples {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.example {
  border: none;
  padding: 9px 12px;
  border-radius: 8px;
  background: #334155;
  color: white;
}

.status {
  margin-top: 12px;
  color: #94a3b8;
  font-size: 13px;
}

/* EDITOR */

.editor {
  margin-top: 20px;
  padding: 15px;
  background: #111827;
  border: 1px solid #334155;
  border-radius: 12px;
}

.editor h2 {
  margin-top: 0;
  font-size: 18px;
}

.color-row {
  display: flex;
  gap: 10px;
  align-items: center;
}

.color-row input {
  height: 45px;
  padding: 3px;
  width: 70px;
}

/* PREVIEW CONTROLS */

.preview-controls {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.preview-controls button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  background: #334155;
  color: white;
}

.preview-controls button.active {
  background: #7c3aed;
}

/* PREVIEW */

.preview-wrapper {
  margin-top: 12px;
  background: #020617;
  border-radius: 12px;
  padding: 15px;
  overflow: auto;
}

.preview-box {
  background: white;
  margin: auto;
  transition: width 0.3s ease;
  min-height: 600px;
  color: #111827;
}

.preview-box.desktop {
  width: 100%;
}

.preview-box.mobile {
  width: 390px;
  max-width: 100%;
}

.preview-bar {
  padding: 10px 14px;
  background: #e2e8f0;
  color: #334155;
  font-size: 13px;
  font-weight: bold;
}

/* GENERATED WEBSITE */

#website {
  background: white;
  color: #111827;
}

.site-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 6%;
  border-bottom: 1px solid #e5e7eb;
}

.logo {
  font-size: 20px;
  font-weight: bold;
}

.nav-links {
  display: flex;
  gap: 18px;
  font-size: 14px;
}

.hero {
  text-align: center;
  padding: 80px 20px;
  background: linear-gradient(135deg, #f5f3ff, #ffffff);
}

.hero h1 {
  font-size: 42px;
  margin: 0 auto 18px;
  max-width: 700px;
}

.hero p {
  max-width: 600px;
  margin: auto;
  color: #64748b;
  font-size: 17px;
  line-height: 1.6;
}

.hero-button {
  display: inline-block;
  margin-top: 25px;
  padding: 13px 22px;
  background: var(--main-color, #7c3aed);
  color: white;
  border-radius: 8px;
  font-weight: bold;
}

.section {
  padding: 60px 6%;
}

.section-title {
  text-align: center;
  font-size: 28px;
  margin-bottom: 35px;
}

.features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.feature {
  padding: 25px;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  background: white;
}

.feature h3 {
  margin-top: 0;
}

.feature p {
  color: #64748b;
  line-height: 1.5;
}

.pricing {
  text-align: center;
  background: #f8fafc;
}

.price {
  font-size: 40px;
  font-weight: bold;
}

.site-footer {
  padding: 30px;
  text-align: center;
  background: #111827;
  color: white;
}

/* MOBILE */

@media (max-width: 650px) {

  .nav-links {
    display: none;
  }

  .hero {
    padding: 60px 20px;
  }

  .hero h1 {
    font-size: 32px;
  }

  .features {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<header class="builder-header">

  <h1>🚀 AniVora Builder</h1>

  <p>
    Describe → Generate → Edit → Preview
  </p>

</header>


<div class="builder">

  <!-- PROMPT -->

  <textarea
    id="prompt"
    placeholder="Example: Create a modern website for an AI startup..."
  ></textarea>


  <button
    class="generate"
    onclick="generateWebsite()"
  >
    ✨ Generate Website
  </button>


  <div class="examples">

    <button class="example"
      onclick="useExample('restaurant')">
      🍔 Restaurant
    </button>

    <button class="example"
      onclick="useExample('portfolio')">
      💼 Portfolio
    </button>

    <button class="example"
      onclick="useExample('fashion')">
      👕 Fashion
    </button>

    <button class="example"
      onclick="useExample('fitness')">
      🏋️ Fitness
    </button>

    <button class="example"
      onclick="useExample('saas')">
      💻 SaaS
    </button>

  </div>


  <div
    class="status"
    id="status">
    Ready.
  </div>


  <!-- EDITOR -->

  <div class="editor">

    <h2>✏️ Edit Website</h2>


    <label>
      Website Name
    </label>

    <input
      id="editName"
      placeholder="AniVora"
      oninput="updateWebsite()"
    >


    <label>
      Headline
    </label>

    <input
      id="editHeadline"
      placeholder="Your headline"
      oninput="updateWebsite()"
    >


    <label>
      Description
    </label>

    <textarea
      id="editDescription"
      placeholder="Your website description"
      oninput="updateWebsite()"
    ></textarea>


    <label>
      Button Text
    </label>

    <input
      id="editButton"
      placeholder="Get Started"
      oninput="updateWebsite()"
    >


    <label>
      Main Color
    </label>

    <div class="color-row">

      <input
        id="editColor"
        type="color"
        value="#7c3aed"
        oninput="updateWebsite()"
      >

      <span>
        Choose your brand color
      </span>

    </div>

  </div>


  <!-- PREVIEW CONTROLS -->

  <div class="preview-controls">

    <button
      id="desktopButton"
      class="active"
      onclick="setDesktop()">
      🖥️ Desktop
    </button>

    <button
      id="mobileButton"
      onclick="setMobile()">
      📱 Mobile
    </button>

    <button
      onclick="resetWebsite()">
      🔄 Reset
    </button>

  </div>


  <!-- PREVIEW -->

  <div class="preview-wrapper">

    <div
      id="previewBox"
      class="preview-box desktop">

      <div class="preview-bar">
        LIVE PREVIEW
      </div>

      <div id="website">

        <section class="hero">

          <h1>
            Your Website
          </h1>

          <p>
            Generate a website to begin editing.
          </p>

          <div class="hero-button">
            Get Started
          </div>

        </section>

      </div>

    </div>

  </div>

</div>


<script>

/* EXAMPLES */

function useExample(type) {

  const prompt =
    document.getElementById("prompt");


  if (type === "restaurant") {

    prompt.value =
      "Create a modern restaurant website.";

  }

  if (type === "portfolio") {

    prompt.value =
      "Create a developer portfolio website.";

  }

  if (type === "fashion") {

    prompt.value =
      "Create a modern fashion store.";

  }

  if (type === "fitness") {

    prompt.value =
      "Create a modern fitness gym.";

  }

  if (type === "saas") {

    prompt.value =
      "Create a SaaS software website for an AI startup.";

  }

}


/* GENERATE */

function generateWebsite() {

  const prompt =
    document.getElementById("prompt").value.trim();

  const status =
    document.getElementById("status");


  if (!prompt) {

    status.innerText =
      "⚠️ Describe your website first.";

    return;

  }


  const text =
    prompt.toLowerCase();


  let name =
    "AniVora";

  let title =
    "Welcome to Our Website";

  let description =
    "A modern website generated by AniVora.";

  let button =
    "Get Started";


  if (
    text.includes("restaurant") ||
    text.includes("food")
  ) {

    name = "Taste";

    title =
      "Taste Something Amazing";

    description =
      "Discover delicious meals and unforgettable flavors.";

    button =
      "View Our Menu";

  }


  else if (
    text.includes("portfolio") ||
    text.includes("developer")
  ) {

    name = "My Portfolio";

    title =
      "Building Digital Experiences";

    description =
      "Explore my projects, skills and experience.";

    button =
      "View My Work";

  }


  else if (
    text.includes("fashion") ||
    text.includes("clothing") ||
    text.includes("store")
  ) {

    name = "Style";

    title =
      "Define Your Style";

    description =
      "Discover modern fashion designed for people who want to stand out.";

    button =
      "Shop Collection";

  }


  else if (
    text.includes("fitness") ||
    text.includes("gym")
  ) {

    name = "FitZone";

    title =
      "Become Stronger";

    description =
      "Train smarter and achieve your fitness goals.";

    button =
      "Join Now";

  }


  else if (
    text.includes("saas") ||
    text.includes("software") ||
    text.includes("app") ||
    text.includes("ai")
  ) {

    name = "Nova";

    title =
      "The Smarter Way to Work";

    description =
      "Powerful software that helps people work faster and smarter.";

    button =
      "Start Free";

  }


  /* PUT VALUES INTO EDITOR */

  document.getElementById("editName").value =
    name;

  document.getElementById("editHeadline").value =
    title;

  document.getElementById("editDescription").value =
    description;

  document.getElementById("editButton").value =
    button;


  updateWebsite();


  status.innerText =
    "✅ Website generated successfully.";

}


/* UPDATE PREVIEW */

function updateWebsite() {

  const name =
    document.getElementById("editName").value ||
    "AniVora";

  const title =
    document.getElementById("editHeadline").value ||
    "Your Website";

  const description =
    document.getElementById("editDescription").value ||
    "Your website description.";

  const button =
    document.getElementById("editButton").value ||
    "Get Started";

  const color =
    document.getElementById("editColor").value;


  document.getElementById("website").style
    .setProperty(
      "--main-color",
      color
    );


  document.getElementById("website").innerHTML = `

    <nav class="site-nav">

      <div class="logo">
        ${name}
      </div>

      <div class="nav-links">

        <span>Home</span>
        <span>Features</span>
        <span>About</span>
        <span>Contact</span>

      </div>

    </nav>


    <section class="hero">

      <h1>
        ${title}
      </h1>

      <p>
        ${description}
      </p>

      <div class="hero-button">
        ${button}
      </div>

    </section>


    <section class="section">

      <h2 class="section-title">
        Everything You Need
      </h2>


      <div class="features">

        <div class="feature">

          <h3>
            Powerful
          </h3>

          <p>
            Everything you need to get started.
          </p>

        </div>


        <div class="feature">

          <h3>
            Simple
          </h3>

          <p>
            Easy to understand and easy to use.
          </p>

        </div>


        <div class="feature">

          <h3>
            Modern
          </h3>

          <p>
            Designed for today's users.
          </p>

        </div>

      </div>

    </section>


    <section class="section pricing">

      <h2 class="section-title">
        Simple Pricing
      </h2>

      <div class="price">
        $19
      </div>

      <p>
        Start today.
      </p>

      <div class="hero-button">
        ${button}
      </div>

    </section>


    <footer class="site-footer">

      Built with AniVora Builder 🚀

    </footer>

  `;

}


/* DESKTOP */

function setDesktop() {

  const preview =
    document.getElementById("previewBox");

  preview.classList.remove("mobile");

  preview.classList.add("desktop");


  document.getElementById(
    "desktopButton"
  ).classList.add("active");

  document.getElementById(
    "mobileButton"
  ).classList.remove("active");

}


/* MOBILE */

function setMobile() {

  const preview =
    document.getElementById("previewBox");

  preview.classList.remove("desktop");

  preview.classList.add("mobile");


  document.getElementById(
    "mobileButton"
  ).classList.add("active");

  document.getElementById(
    "desktopButton"
  ).classList.remove("active");

}


/* RESET */

function resetWebsite() {

  document.getElementById("editName").value =
    "";

  document.getElementById("editHeadline").value =
    "";

  document.getElementById("editDescription").value =
    "";

  document.getElementById("editButton").value =
    "";


  document.getElementById("website").innerHTML = `

    <section class="hero">

      <h1>
        Your Website
      </h1>

      <p>
        Generate a website to begin editing.
      </p>

      <div class="hero-button">
        Get Started
      </div>

    </section>

  `;


  document.getElementById("status").innerText =
    "Preview reset.";

}

</script>

</body>
</html>
