<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniVora Builder</title><style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090b10;
  color: white;
}

button,
textarea {
  font: inherit;
}

.topbar {
  height: 64px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #10131a;
  border-bottom: 1px solid #292d38;
}

.logo {
  font-size: 21px;
  font-weight: 800;
}

.logo span {
  color: #7c5cff;
}

.actions {
  display: flex;
  gap: 7px;
}

.small-btn {
  padding: 9px 11px;
  border-radius: 8px;
  border: 1px solid #303543;
  background: #171a22;
  color: white;
}

.small-btn.active {
  background: #7c5cff;
  border-color: #7c5cff;
}

.builder {
  display: grid;
  grid-template-columns: 340px 1fr;
  min-height: calc(100vh - 64px);
}

.sidebar {
  padding: 20px;
  background: #10131a;
  border-right: 1px solid #292d38;
}

.sidebar h1 {
  font-size: 24px;
  margin: 0 0 8px;
}

.description {
  color: #9da3b4;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  min-height: 180px;
  padding: 14px;
  resize: vertical;
  border-radius: 12px;
  border: 1px solid #303543;
  background: #181b24;
  color: white;
  outline: none;
}

textarea:focus {
  border-color: #7c5cff;
}

.generate {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #7c5cff;
  color: white;
  font-weight: 800;
}

.generate:active {
  transform: scale(.98);
}

h3 {
  margin-top: 25px;
}

.example {
  display: block;
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  text-align: left;
  border: 1px solid #303543;
  border-radius: 9px;
  background: #171a22;
  color: white;
}

.workspace {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.workspace-top {
  height: 50px;
  padding: 0 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #292d38;
}

.status {
  color: #9da3b4;
  font-size: 12px;
}

.preview-area {
  flex: 1;
  padding: 20px;
  display: flex;
  justify-content: center;
  background: #080a0f;
  overflow: auto;
}

#preview {
  width: 100%;
  max-width: 1100px;
  height: 700px;
  border: 0;
  border-radius: 10px;
  background: white;
}

@media (max-width: 800px) {

  .builder {
    grid-template-columns: 1fr;
  }

  .sidebar {
    border-right: 0;
    border-bottom: 1px solid #292d38;
  }

  #preview {
    height: 650px;
  }

}

@media (max-width: 500px) {

  .topbar {
    padding: 0 10px;
  }

  .actions {
    gap: 3px;
  }

  .small-btn {
    padding: 7px;
    font-size: 11px;
  }

}

</style></head><body><header class="topbar">  <div class="logo">
    Ani<span>Vora</span> Builder
  </div>  <div class="actions"><button
  class="small-btn active"
  id="desktopBtn">
  🖥
</button>

<button
  class="small-btn"
  id="mobileBtn">
  📱
</button>

<button
  class="small-btn"
  id="exportBtn">
  ↓ Export
</button>

  </div></header><main class="builder">  <aside class="sidebar"><h1>Build your website</h1>

<p class="description">
  Describe what you want to build and AniVora
  will generate a website preview.
</p>

<textarea
  id="prompt"
  placeholder="Example: Create a modern restaurant website with a menu, about section and contact page."></textarea>

<button
  class="generate"
  id="generateBtn">
  ✨ Generate Website
</button>

<h3>Try an example</h3>

<button
  class="example"
  data-prompt="Create a modern restaurant website with a menu, about section and contact information.">
  🍽 Restaurant
</button>

<button
  class="example"
  data-prompt="Create a professional portfolio website for a software developer with projects and skills.">
  💻 Developer Portfolio
</button>

<button
  class="example"
  data-prompt="Create a modern fashion brand website with products and collections.">
  👕 Fashion Brand
</button>

<button
  class="example"
  data-prompt="Create a modern fitness website with workout programs and trainers.">
  🏋️ Fitness
</button>

  </aside>  <section class="workspace"><div class="workspace-top">

  <strong>Live Preview</strong>

  <span
    class="status"
    id="status">
    Ready
  </span>

</div>

<div class="preview-area">

  <iframe
    id="preview"
    title="Website Preview">
  </iframe>

</div>

  </section></main><script>

const promptBox =
  document.getElementById("prompt");

const generateButton =
  document.getElementById("generateBtn");

const preview =
  document.getElementById("preview");

const status =
  document.getElementById("status");

const desktopButton =
  document.getElementById("desktopBtn");

const mobileButton =
  document.getElementById("mobileBtn");

const exportButton =
  document.getElementById("exportBtn");


function generateWebsite() {

  const prompt =
    promptBox.value.trim();

  if (!prompt) {

    status.textContent =
      "Type what you want to build first.";

    alert(
      "Please describe the website you want."
    );

    return;

  }

  status.textContent =
    "Generating...";

  const text =
    prompt.toLowerCase();

  let title =
    "Your New Website";

  let description =
    "A modern website created with AniVora.";


  if (text.includes("restaurant")) {

    title =
      "Taste Something Amazing";

    description =
      "Discover delicious food, beautiful experiences and a menu created for you.";

  }

  else if (
    text.includes("portfolio") ||
    text.includes("developer")
  ) {

    title =
      "Build. Create. Inspire.";

    description =
      "A professional portfolio showcasing projects, skills and experience.";

  }

  else if (text.includes("fashion")) {

    title =
      "Define Your Style";

    description =
      "Discover a modern collection created for people who want to stand out.";

  }

  else if (text.includes("fitness")) {

    title =
      "Become Your Strongest Self";

    description =
      "Training programs, expert coaching and everything you need to reach your goals.";

  }

  else if (text.includes("barber")) {

    title =
      "Look Sharp. Feel Confident.";

    description =
      "Professional grooming and modern styles designed around you.";

  }

  else if (text.includes("business")) {

    title =
      "Grow Your Business";

    description =
      "A professional website designed to help your business grow.";

  }

  else {

    title =
      "Bring Your Idea To Life";

    description =
      prompt;

  }


  const website = `

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>${title}</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #151515;
}

.hero {

  min-height: 70vh;

  padding: 50px 25px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  background:
    linear-gradient(
      135deg,
      #eeeaff,
      #ffffff
    );

}

.hero h1 {

  max-width: 850px;

  margin: 0 0 20px;

  font-size:
    clamp(
      38px,
      7vw,
      72px
    );

  line-height: 1;

}

.hero p {

  max-width: 650px;

  color: #555;

  line-height: 1.7;

  font-size: 17px;

}

.hero button {

  margin-top: 15px;

  padding: 14px 25px;

  border: 0;

  border-radius: 9px;

  background: #7c5cff;

  color: white;

  font-weight: bold;

}

.features {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 20px;

  padding: 60px 30px;

}

.feature {

  padding: 25px;

  border: 1px solid #ddd;

  border-radius: 12px;

}

.feature p {

  color: #666;

  line-height: 1.5;

}

@media(max-width:700px) {

  .features {

    grid-template-columns: 1fr;

  }

}

</style></head><body><section class="hero"><h1>
${title}
</h1><p>
${description}
</p><button>
Get Started
</button></section><section class="features"><div class="feature"><h3>
Modern Design
</h3><p>
A clean and professional layout.
</p></div><div class="feature"><h3>
Responsive
</h3><p>
Designed for phones, tablets and computers.
</p></div><div class="feature"><h3>
Easy to Customize
</h3><p>
Continue editing your website after generation.
</p></div></section></body></html>`;

preview.srcdoc =
website;

preview.dataset.website =
website;

status.textContent =
"Website generated ✓";

}

generateButton.addEventListener(
"click",
generateWebsite
);

document
.querySelectorAll(".example")
.forEach(button => {

button.addEventListener(
  "click",
  function() {

    promptBox.value =
      this.dataset.prompt;

    generateWebsite();

  }
);

});

desktopButton.addEventListener(
"click",
function() {

preview.style.width =
  "100%";

desktopButton.classList.add(
  "active"
);

mobileButton.classList.remove(
  "active"
);

}
);

mobileButton.addEventListener(
"click",
function() {

preview.style.width =
  "390px";

mobileButton.classList.add(
  "active"
);

desktopButton.classList.remove(
  "active"
);

}
);

exportButton.addEventListener(
"click",
function() {

const website =
  preview.dataset.website;

if (!website) {

  alert(
    "Generate a website first."
  );

  return;

}

const blob =
  new Blob(
    [website],
    {
      type:
        "text/html"
    }
  );

const url =
  URL.createObjectURL(blob);

const link =
  document.createElement("a");

link.href =
  url;

link.download =
  "anivora-website.html";

document.body.appendChild(
  link
);

link.click();

link.remove();

URL.revokeObjectURL(
  url
);

status.textContent =
  "Website exported ✓";

}
);

</script></body>
  </html>
